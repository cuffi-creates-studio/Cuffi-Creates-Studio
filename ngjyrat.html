<style>

<script>
    // DATA INITIALIZATION WITH LOCALFORAGE (INDEXEDDB)
    let inventory = [];

    const defaultItems = [
        { id: 1, name: "E bardhë", category: "500g", qty: 32, price: 9.00, img: "https://via.placeholder.com/1000?text=Cone+White" },
        { id: 2, name: "Rozë", category: "500g", qty: 24, price: 9.00, img: "https://via.placeholder.com/1000?text=Cone+Pink" },
        { id: 3, name: "E verdhë", category: "500g", qty: 18, price: 9.00, img: "https://via.placeholder.com/1000?text=Cone+Yellow" },
        { id: 4, name: "E bardhë", category: "50g", qty: 45, price: 2.20, img: "https://via.placeholder.com/1000?text=Ball+White" },
        { id: 5, name: "Rozë", category: "50g", qty: 5, price: 2.20, img: "https://via.placeholder.com/1000?text=Ball+Pink" },
        { id: 6, name: "Pistoletë Tufting 2cm", category: "material", qty: 1, price: 140.00, img: "https://via.placeholder.com/1000?text=Tufting+Gun" },
        { id: 7, name: "Spray Glue Prime Fix", category: "material", qty: 2, price: 14.00, img: "https://via.placeholder.com/1000?text=Spray+Glue" }
    ];

   // ======================================================
// LOAD DATA FROM INDEXEDDB
// ======================================================

async function loadData() {
    try {

        const savedData = await localforage.getItem(
            'tufting_studio_inventory'
        );

        if (
            savedData &&
            Array.isArray(savedData) &&
            savedData.length > 0
        ) {
            inventory = savedData;

            console.log(
                "Inventari u ngarkua:",
                inventory.length,
                "produkte"
            );

        } else {

            inventory = defaultItems;

            await saveData();

            console.log(
                "Nuk kishte inventar të ruajtur. U përdor defaultItems."
            );
        }

    } catch (err) {

        console.error(
            "Gabim në leximin e të dhënave:",
            err
        );

        inventory = defaultItems;
    }

    renderApp();
}

// ======================================================
// IMPORTO BACKUP-IN E INVENTARIT
// ======================================================

async function importInventoryBackup() {

    try {

        const input = document.createElement("input");

        input.type = "file";
        input.accept = ".json,application/json";

        input.onchange = async function(event) {

            try {

                const file = event.target.files[0];

                if (!file) {
                    return;
                }

                const text = await file.text();
                const data = JSON.parse(text);

                if (!Array.isArray(data)) {
                    throw new Error("Backup-i nuk ka formatin e duhur.");
                }

                if (data.length === 0) {
                    throw new Error("Backup-i është bosh.");
                }

                const answer = confirm(
                    "U gjetën " +
                    data.length +
                    " produkte në backup.\n\n" +
                    "Dëshiron t'i importosh?"
                );

                if (!answer) {
                    return;
                }

                inventory = data;

                await saveData();

                renderApp();

                alert(
                    "Backup-i u importua me sukses!\n\n" +
                    "Produkte: " +
                    inventory.length
                );

            } catch (error) {

                console.error("Gabim gjatë importimit:", error);

                alert(
                    "Importimi dështoi:\n\n" +
                    error.message
                );
            }
        };

        input.click();

    } catch (error) {

        console.error(error);

        alert("Nuk u hap dot backup-i.");
    }
}


// ======================================================
// MIGRO FOTOT BASE64 NE FOLDERIN E APLIKACIONIT
// ======================================================

async function migrateInventoryImages() {

    try {

        // Kjo funksionon vetëm brenda Electron
        if (
            typeof require !== "function"
        ) {
            alert(
                "Migrimi i fotove duhet të bëhet nga aplikacioni Electron, jo nga Go Live."
            );

            return;
        }

        const { ipcRenderer } =
            require("electron");


        // Kontrollo inventarin
        if (
            !Array.isArray(inventory) ||
            inventory.length === 0
        ) {
            alert(
                "Inventari është bosh."
            );

            return;
        }


        // Numërojmë fotot Base64
        const base64Photos =
            inventory.filter(
                item =>
                    item.img &&
                    typeof item.img === "string" &&
                    item.img.startsWith("data:image")
            );


        // Nëse nuk ka më foto Base64
        if (base64Photos.length === 0) {

            alert(
                "Nuk u gjet asnjë foto Base64 për transferim.\n\n" +
                "Fotot mund të jenë transferuar tashmë."
            );

            return;
        }


        const answer = confirm(
            "U gjetën " +
            base64Photos.length +
            " foto për transferim.\n\n" +

            "Produktet, emrat, çmimet dhe sasitë nuk do të fshihen.\n\n" +

            "Fotot do të ruhen si skedarë normalë në folderin e aplikacionit.\n\n" +

            "Vazhdo?"
        );


        if (!answer) {
            return;
        }


        // Dërgo inventarin te main.js
        const result =
            await ipcRenderer.invoke(
                "migrate-inventory-images",
                inventory
            );


        if (
            !result ||
            !result.success
        ) {

            throw new Error(
                result?.error ||
                "Migrimi dështoi."
            );
        }


        // Marrim inventarin e ri
        inventory = result.items;


        // E ruajmë përsëri në IndexedDB
        await saveData();


        // Rifreskojmë kartat
        renderApp();


        console.log(
            "Migrimi përfundoi:",
            result
        );


        alert(
            "MIGRIMI PËRFUNDOI ME SUKSES!\n\n" +

            "Foto të transferuara: " +
            result.converted +

            "\nFoto të paprekura: " +
            result.skipped +

            "\n\nProduktet totale: " +
            inventory.length +

            "\n\nFotot janë ruajtur në:\n" +
            result.folder
        );


    } catch (error) {

        console.error(
            "Gabim gjatë migrimit të fotove:",
            error
        );

        alert(
            "Migrimi i fotove dështoi.\n\n" +
            error.message +
            "\n\nBackup-i nuk është prekur."
        );
    }
}


// ======================================================
// RENDER APPLICATION
// ======================================================

function getImageSrc(img) {
    if (!img) return "";

    // Base64 dhe URL web përdoren direkt
    if (img.startsWith("data:image") || img.startsWith("http://") || img.startsWith("https://") || img.startsWith("file://")) {
        return img;
    }

    // Rrugët lokale të Windows kthehen në file:// URL për Electron
    try {
        if (typeof require === "function") {
            const { pathToFileURL } = require("url");
            return pathToFileURL(img).href;
        }
    } catch (err) {
        console.error("Gabim në konvertimin e rrugës së fotos:", err);
    }

    return img;
}

function renderApp() {
    const searchEl = document.getElementById('searchInput');
    const query = searchEl ? searchEl.value.toLowerCase().trim() : '';

    const grid500 = document.getElementById('grid500g');
    const grid50 = document.getElementById('grid50g');
    const gridMat = document.getElementById('gridMaterials');
    const alertList = document.getElementById('alertList');
    const alertListInline = document.getElementById('alertListInline');

    if (!grid500 || !grid50 || !gridMat || !alertList || !alertListInline) {
        console.error('Nuk u gjetën container-at e inventarit.');
        return;
    }

    grid500.innerHTML = '';
    grid50.innerHTML = '';
    gridMat.innerHTML = '';
    alertList.innerHTML = '';
    alertListInline.innerHTML = '';

    inventory.forEach(item => {
        const itemName = String(item.name || '').toLowerCase();
        if (!itemName.includes(query)) return;

        const cardHTML = createCardHTML(item);

        if (item.category === '500g') {
            grid500.innerHTML += cardHTML;
        } else if (item.category === '50g') {
            grid50.innerHTML += cardHTML;
        } else {
            gridMat.innerHTML += cardHTML;
        }

        if (Number(item.qty) <= 5) {
            const lowStockRow = `
                <div class="alert-item">
                    <span><strong>${escapeHTML(item.name)}</strong> <small style="color:var(--text-muted);">(${escapeHTML(item.category)})</small></span>
                    <span style="font-weight:bold; color:var(--red-alert);">${Number(item.qty) || 0} copë</span>
                </div>
            `;
            alertList.innerHTML += lowStockRow;
            alertListInline.innerHTML += lowStockRow;
        }
    });
}

function escapeHTML(value) {
    return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}

function createCardHTML(item) {
    const qty = Number(item.qty) || 0;
    const isLow = qty <= 5;
    const statusClass = isLow ? 'low-stock' : 'in-stock';
    const statusText = isLow ? 'Po mbaron' : 'Në stok';

    const hasImage = item.img && !String(item.img).includes('via.placeholder.com');
    const imageSrc = hasImage ? getImageSrc(String(item.img)) : '';

    let categoryText = 'Material';
    if (item.category === '500g') categoryText = '500g';
    if (item.category === '50g') categoryText = '50g';

    const safeName = escapeHTML(item.name);
    const safeImageSrc = escapeHTML(imageSrc);
    const safeCategory = escapeHTML(categoryText);
    const price = Number.parseFloat(item.price);
    const safePrice = Number.isFinite(price) ? price.toFixed(2) : '0.00';

    return `
        <div class="card" style="position: relative;">
            <button onclick="deleteItem(${Number(item.id)})"
                    title="Fshi artikullin"
                    style="position:absolute; top:6px; right:6px; z-index:10; background:rgba(0,0,0,.05); color:#9ca3af; border:none; width:20px; height:20px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center;"
                    onmouseover="this.style.background='#ef4444';this.style.color='white'"
                    onmouseout="this.style.background='rgba(0,0,0,.05)';this.style.color='#9ca3af'">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
            </button>

            <div class="card-img-container" style="position:relative; height:110px;">
                ${hasImage ? `
                    <img src="${safeImageSrc}" alt="${safeName}"
                         onclick="openImageViewer(this.src)"
                         style="width:100%; height:100%; object-fit:contain; cursor:zoom-in;"
                         title="Klikoni për ta parë të madhe">
                    <button onclick="document.getElementById('upload-file-${Number(item.id)}').click()"
                            title="Ndrysho foton"
                            style="position:absolute; bottom:6px; right:6px; background:rgba(255,255,255,.9); color:#4b5563; border:1px solid rgba(0,0,0,.08); border-radius:50%; width:26px; height:26px; cursor:pointer; display:flex; align-items:center; justify-content:center;">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                    </button>
                ` : `
                    <div onclick="document.getElementById('upload-file-${Number(item.id)}').click()"
                         style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:#8b5cf6; cursor:pointer;">
                        <span style="font-size:28px; font-weight:bold; line-height:1;">+</span>
                        <span style="font-size:10px; font-weight:600; margin-top:2px; color:#6b7280;">Shto Foto</span>
                    </div>
                `}
            </div>

            <input type="file" id="upload-file-${Number(item.id)}" accept="image/*" style="display:none;" onchange="changeCardImage(${Number(item.id)}, event)">

            <div class="card-title">${safeName}</div>
            <div class="card-weight">${safeCategory}</div>
            <div class="card-status-row">
                <span class="status-badge ${statusClass}"><span class="dot"></span> ${statusText}</span>
                <span style="color:var(--text-muted);">${qty} copë</span>
            </div>
            <div class="card-price">${safePrice} €</div>
            <div class="qty-controls">
                <button class="btn-qty" onclick="updateQty(${Number(item.id)}, -1)">-</button>
                <span style="font-size:12px; font-weight:bold;">${qty}</span>
                <button class="btn-qty" onclick="updateQty(${Number(item.id)}, 1)">+</button>
            </div>
        </div>
    `;
}

async function changeCardImage(id, event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;

    const item = inventory.find(i => Number(i.id) === Number(id));
    if (!item) return;

    const reader = new FileReader();

    reader.onload = async function(e) {
        try {
            if (typeof require !== 'function') {
                throw new Error('Ndryshimi i fotos duhet të bëhet nga aplikacioni Electron.');
            }

            const { ipcRenderer } = require('electron');
            const result = await ipcRenderer.invoke('save-inventory-image', { dataUrl: e.target.result });

            if (!result || !result.success) {
                throw new Error(result?.error || 'Fotoja nuk u ruajt.');
            }

            item.img = result.path;
            await saveData();
            renderApp();
        } catch (error) {
            console.error('Gabim gjatë ndryshimit të fotos:', error);
            alert('Fotoja nuk u ndryshua: ' + error.message);
        }
    };

    reader.readAsDataURL(file);
}

async function saveData() {

    try {

        await localforage.setItem(
            'tufting_studio_inventory',
            inventory
        );

        console.log(
            "Inventari u ruajt:",
            inventory.length,
            "produkte"
        );

    } catch (err) {

        console.error(
            "Gabim në ruajtje:",
            err
        );
    }
}

// FUNKSIONI PËR TË FSHIRË ARTIKULLIN NGA INVENTARI DHE INDEXEDDB
async function deleteItem(id) {
    const item = inventory.find(i => i.id === id);
    if (!item) return;

    if (confirm(`A jeni të sigurt që dëshironi të fshini "${item.name}"?`)) {
        // Largojmë artikullin nga array
        inventory = inventory.filter(i => i.id !== id);
        
        // Ruajmë gjendjen e re në IndexedDB
        await saveData();
        
        // Rifreskojmë pamjen
        renderApp();
    }
}

    // UPDATE QUANTITY
    async function updateQty(id, change) {
        const item = inventory.find(i => i.id === id);
        if (item) {
            item.qty = Math.max(0, item.qty + change);
            await saveData();
            renderApp();
        }
    }

    // MODAL CONTROL & ADD ITEM
    let currentModalType = '500g';
    function openModal(type) {
        currentModalType = type;
        document.getElementById('itemModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('itemModal').style.display = 'none';
    }

    // CONVERT 1000x1000 FILE TO DATAURL AND SAVE
 async function saveNewItem() {
    const name = document.getElementById('itemName').value;
    const category = document.getElementById('itemCategory').value;
    const qty = parseInt(document.getElementById('itemQty').value) || 0;
    const price = parseFloat(document.getElementById('itemPrice').value) || 0.0;
    const fileInput = document.getElementById('itemImage');

    if (!name || fileInput.files.length === 0) {
        alert("Ju lutemi plotësoni emrin dhe zgjidhni një foto!");
        return;
    }

    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = async function (e) {
        try {
            const { ipcRenderer } = require("electron");

            // Ruaj foton si file normal në disk
            const result = await ipcRenderer.invoke(
                "save-inventory-image",
                {
                    dataUrl: e.target.result
                }
            );

            if (!result.success) {
                throw new Error(result.error);
            }

            const newItem = {
                id: Date.now(),
                name: name,
                category: category,
                qty: qty,
                price: price,

                // Tani ruajmë vetëm rrugën e fotos
                img: result.path
            };

            inventory.push(newItem);

            await saveData();

            renderApp();
            closeModal();

        } catch (error) {
            console.error("Gabim gjatë ruajtjes së fotos:", error);
            alert("Fotoja nuk u ruajt: " + error.message);
        }
    };

    reader.readAsDataURL(file);
}
    // FILTER FUNCTION FOR YARN
    let activeYarnFilter = '500g';
    function filterYarn(type) {
        activeYarnFilter = type;
        const g500 = document.getElementById('yarn500Container');
        const g50 = document.getElementById('yarn50Container');
        const mat = document.querySelector('.material-grid')?.closest('.section-box');
        const listBox = document.getElementById('listContainer');
        document.querySelectorAll('[data-filter-btn]').forEach(btn => btn.classList.toggle('active', btn.dataset.filterBtn === type));

        g500.style.display = type === '500g' ? 'block' : 'none';
        g50.style.display = type === '50g' ? 'block' : 'none';
        if (mat) mat.style.display = type === 'material' ? 'block' : '';
        if (type === 'material') {
            g500.style.display = 'none';
            g50.style.display = 'none';
            if (listBox) listBox.style.display = 'none';
        } else if (type === 'list') {
            g500.style.display = 'none';
            g50.style.display = 'none';
            if (mat) mat.style.display = '';
            if (listBox) listBox.style.display = 'block';
            if (mat) mat.style.display = 'none';
        } else {
            if (mat) mat.style.display = 'none';
            if (listBox) listBox.style.display = 'none';
        }
    }

// INIT
window.onload = async () => { await loadData(); filterYarn(activeYarnFilter); };

function openImageViewer(imgSrc) {
    const modal = document.getElementById('imageViewerModal');
    const fullImg = document.getElementById('fullImageView');
    fullImg.src = imgSrc;
    modal.style.display = 'flex';
}

function closeImageViewer() {
    document.getElementById('imageViewerModal').style.display = 'none';
}
