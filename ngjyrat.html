<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07091a">
  <title>Inventari i Ngjyrave · Cuffi Creates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root{--bg:#060817;--panel:#0b1026;--panel2:#10162f;--line:#26315a;--text:#f7f8ff;--muted:#929bbd;--purple:#b72cff;--blue:#2c74ff;--green:#19f07d;--pink:#ff3eb5;--danger:#ff4e75;--shadow:0 20px 70px rgba(0,0,0,.35)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 15% 0,rgba(106,24,180,.15),transparent 35%),radial-gradient(circle at 90% 5%,rgba(42,106,255,.12),transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}.page{max-width:1450px;margin:auto;padding:22px 24px 44px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.titlebox{display:flex;align-items:center;gap:14px}.back{width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:#0a0f24;color:#fff;cursor:pointer}.titlebox h1{font-size:24px;margin:0}.titlebox p{margin:5px 0 0;color:var(--muted);font-size:12px}.sync{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:9px;height:9px;border-radius:50%;background:#5a658a;box-shadow:0 0 14px currentColor}.sync.online .dot{background:var(--green)}
    .toolbar{display:grid;grid-template-columns:minmax(220px,1fr) auto auto;gap:12px;margin-bottom:18px}.search{height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:#090e22}.search input{width:100%;border:0;outline:0;background:transparent;color:#fff}.btn{height:48px;border-radius:14px;padding:0 18px;border:1px solid var(--line);background:#0c1229;color:#fff;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:9px}.btn.primary{border:0;background:linear-gradient(100deg,var(--purple),var(--blue));box-shadow:0 0 24px rgba(170,47,255,.25)}.btn:hover{filter:brightness(1.08)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(17,24,53,.94),rgba(8,12,29,.94));padding:15px 16px}.stat span{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;margin-top:5px;font-size:22px}.stat small{color:var(--green);font-size:10px}
    .panel{border:1px solid var(--line);border-radius:18px;background:rgba(8,12,29,.86);box-shadow:var(--shadow);overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid rgba(70,83,130,.35)}.panel-head h2{font-size:15px;margin:0}.panel-head span{font-size:11px;color:var(--muted)}
    .grid{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px}.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted)}.empty i{font-size:36px;margin-bottom:12px;color:#596386}.card{position:relative;border:1px solid #26315a;border-radius:17px;background:linear-gradient(180deg,#10162f,#0a0f24);overflow:hidden;min-height:235px}.swatch{height:74px;background:var(--swatch,#9b5cff);position:relative}.swatch:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.18))}.card-body{padding:14px}.code{font-size:10px;color:#d56fff;text-transform:uppercase;letter-spacing:.12em;font-weight:800}.card h3{margin:6px 0 3px;font-size:17px}.meta{color:var(--muted);font-size:11px;min-height:16px}.qty{display:flex;align-items:end;justify-content:space-between;margin-top:16px}.qty strong{font-size:27px}.qty span{font-size:11px;color:var(--muted)}.low{color:#ffb12b!important}.zero{color:var(--danger)!important}.actions{display:flex;gap:8px;margin-top:14px}.iconbtn{height:34px;flex:1;border-radius:10px;border:1px solid #2a365f;background:#0d132c;color:#dce2ff;cursor:pointer}.iconbtn.delete{color:#ff6b89;border-color:rgba(255,78,117,.35)}.thumb{position:absolute;right:10px;top:10px;width:54px;height:54px;border-radius:12px;object-fit:cover;border:1px solid rgba(255,255,255,.3);z-index:2;background:#0b1026}
    dialog{width:min(590px,calc(100vw - 24px));border:1px solid #344170;border-radius:20px;background:#0b1026;color:#fff;padding:0;box-shadow:0 30px 100px rgba(0,0,0,.6)}dialog::backdrop{background:rgba(2,4,14,.75);backdrop-filter:blur(4px)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:17px 18px;border-bottom:1px solid #27325a}.modal-head h3{margin:0;font-size:17px}.x{width:36px;height:36px;border:0;border-radius:10px;background:#121a38;color:#fff;cursor:pointer}.form{padding:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#b3bcdd;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid #2c3967;border-radius:11px;background:#080d20;color:#fff;outline:none;padding:11px 12px}.field input{height:44px}.field input:focus,.field textarea:focus,.field select:focus{border-color:#7557ff;box-shadow:0 0 0 3px rgba(117,87,255,.12)}.color-row{display:grid;grid-template-columns:58px 1fr;gap:9px}.color-row input[type=color]{padding:4px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;padding-top:17px}.error{min-height:18px;margin-top:8px;color:#ff7893;font-size:11px}.toast{position:fixed;right:18px;bottom:18px;z-index:50;max-width:360px;padding:13px 15px;border:1px solid #33406e;border-radius:13px;background:#0c122a;box-shadow:var(--shadow);display:none}.toast.show{display:block}.toast strong{display:block;font-size:12px}.toast span{display:block;color:#aeb7d9;font-size:11px;margin-top:4px}
    @media(max-width:760px){.page{padding:14px 12px 90px}.topbar{align-items:flex-start}.titlebox h1{font-size:19px}.sync{margin-top:10px}.toolbar{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr;padding:11px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.btn{padding:0 12px;font-size:12px}.card{min-height:225px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="titlebox"><button class="back" id="backBtn" aria-label="Kthehu"><i class="fa-solid fa-arrow-left"></i></button><div><h1>Inventari i Ngjyrave</h1><p>Menaxho ngjyrat, kodet dhe sasitë e materialeve.</p></div></div>
      <div class="sync" id="syncState"><i class="dot"></i><span>Duke u lidhur…</span></div>
    </header>

    <section class="toolbar">
      <label class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" placeholder="Kërko emër, kod, markë…"></label>
      <button class="btn" id="refreshBtn"><i class="fa-solid fa-rotate"></i> Rifresko</button>
      <button class="btn primary" id="addBtn"><i class="fa-solid fa-plus"></i> Shto ngjyrë</button>
    </section>

    <section class="stats">
      <article class="stat"><span>Ngjyra</span><strong id="statColors">0</strong><small>regjistrime</small></article>
      <article class="stat"><span>Sasia totale</span><strong id="statQty">0</strong><small>njësi</small></article>
      <article class="stat"><span>Stok i ulët</span><strong id="statLow">0</strong><small>≤ 2 njësi</small></article>
      <article class="stat"><span>Pa stok</span><strong id="statZero">0</strong><small>duhen porositur</small></article>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Ngjyrat e ruajtura</h2><span id="resultCount">0 rezultate</span></div>
      <div class="grid" id="colorGrid"></div>
    </section>
  </main>

  <dialog id="colorDialog">
    <form id="colorForm" class="form">
      <div class="modal-head" style="margin:-18px -18px 18px"><h3 id="dialogTitle">Shto ngjyrë</h3><button type="button" class="x" id="closeDialog"><i class="fa-solid fa-xmark"></i></button></div>
      <input type="hidden" id="itemId">
      <div class="fields">
        <div class="field"><label>Emri *</label><input id="itemName" required placeholder="p.sh. Neon Pink"></div>
        <div class="field"><label>Kodi</label><input id="itemCode" placeholder="p.sh. NP-104"></div>
        <div class="field"><label>Marka</label><input id="itemBrand" placeholder="p.sh. Himalaya"></div>
        <div class="field"><label>Sasia</label><input id="itemQty" type="number" min="0" step="1" value="1"></div>
        <div class="field"><label>Njësia</label><select id="itemUnit"><option value="copë">copë</option><option value="kg">kg</option><option value="g">g</option><option value="rrotull">rrotull</option><option value="paketë">paketë</option></select></div>
        <div class="field"><label>Ngjyra</label><div class="color-row"><input id="itemHex" type="color" value="#a855f7"><input id="itemHexText" value="#a855f7" maxlength="7"></div></div>
        <div class="field full"><label>Foto (opsionale)</label><input id="itemImage" type="file" accept="image/*"></div>
        <div class="field full"><label>Shënim</label><textarea id="itemNotes" rows="3" placeholder="Detaje për materialin…"></textarea></div>
      </div>
      <div class="error" id="formError"></div>
      <div class="modal-actions"><button type="button" class="btn" id="cancelDialog">Anulo</button><button class="btn primary" id="saveBtn" type="submit"><i class="fa-solid fa-floppy-disk"></i> Ruaj</button></div>
    </form>
  </dialog>

  <div class="toast" id="toast"><strong></strong><span></span></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    'use strict';
    const SUPABASE_URL = 'https://xvnvzadfteklfqaiqdrq.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ekRk1TrmEX8wF3DTxx1pZw_hahcOzzu';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {auth:{persistSession:true,autoRefreshToken:true,storage:window.localStorage}});
    const LOCAL_KEY = 'cc_color_inventory';
    let items = [];
    let user = null;
    let remoteEnabled = false;
    let currentImageUrl = '';
    const $ = s => document.querySelector(s);

    function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function localRead(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY))||[]}catch{return []}}
    function localWrite(){localStorage.setItem(LOCAL_KEY,JSON.stringify(items));}
    function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
    function toast(title,msg){const t=$('#toast');t.querySelector('strong').textContent=title;t.querySelector('span').textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3500)}
    function setSync(text,online=false){const el=$('#syncState');el.querySelector('span').textContent=text;el.classList.toggle('online',online)}

    async function init(){
      const {data:{session}} = await sb.auth.getSession();
      user = session?.user || null;
      if(user){
        try{
          const {data,error}=await sb.from('user_inventory').select('inventory').eq('user_id',user.id).maybeSingle();
          if(error) throw error;
          remoteEnabled=true;
          if(data?.inventory && Array.isArray(data.inventory)) items=data.inventory;
          else {items=localRead(); await saveRemote();}
          localWrite();
          setSync('Supabase · sinkronizuar',true);
        }catch(err){
          console.error(err);items=localRead();setSync('Local · kontrollo SQL/Supabase',false);
        }
      }else{
        items=localRead();setSync('Local · pa sesion Supabase',false);
      }
      render();
    }

    async function saveRemote(){
      localWrite();
      if(!remoteEnabled || !user) return;
      setSync('Duke ruajtur…',true);
      const {error}=await sb.from('user_inventory').upsert({user_id:user.id,inventory:items,updated_at:new Date().toISOString()},{onConflict:'user_id'});
      if(error){setSync('Gabim sinkronizimi',false);throw error}
      setSync('Supabase · sinkronizuar',true);
    }

    function render(){
      const q=$('#searchInput').value.trim().toLowerCase();
      const filtered=items.filter(x=>[x.name,x.code,x.brand,x.notes].join(' ').toLowerCase().includes(q));
      $('#resultCount').textContent=`${filtered.length} rezultate`;
      $('#statColors').textContent=items.length;
      $('#statQty').textContent=items.reduce((s,x)=>s+Number(x.quantity||0),0);
      $('#statLow').textContent=items.filter(x=>Number(x.quantity||0)>0&&Number(x.quantity||0)<=2).length;
      $('#statZero').textContent=items.filter(x=>Number(x.quantity||0)<=0).length;
      const grid=$('#colorGrid');
      if(!filtered.length){grid.innerHTML='<div class="empty"><i class="fa-solid fa-palette"></i><div>Nuk ka ngjyra për t’u shfaqur.</div></div>';return}
      grid.innerHTML=filtered.map(x=>{
        const qty=Number(x.quantity||0), cls=qty<=0?'zero':qty<=2?'low':'';
        return `<article class="card" style="--swatch:${esc(x.hex||'#a855f7')}">${x.imageUrl?`<img class="thumb" src="${esc(x.imageUrl)}" alt="">`:''}<div class="swatch"></div><div class="card-body"><div class="code">${esc(x.code||'PA KOD')}</div><h3>${esc(x.name||'Pa emër')}</h3><div class="meta">${esc(x.brand||'')} ${x.notes?'· '+esc(x.notes):''}</div><div class="qty"><div><strong class="${cls}">${qty}</strong> <span>${esc(x.unit||'copë')}</span></div><span>${esc(x.hex||'')}</span></div><div class="actions"><button class="iconbtn" data-edit="${esc(x.id)}"><i class="fa-solid fa-pen"></i> Ndrysho</button><button class="iconbtn delete" data-delete="${esc(x.id)}"><i class="fa-solid fa-trash"></i></button></div></div></article>`
      }).join('');
    }

    function openDialog(item=null){
      $('#dialogTitle').textContent=item?'Ndrysho ngjyrën':'Shto ngjyrë';
      $('#itemId').value=item?.id||'';$('#itemName').value=item?.name||'';$('#itemCode').value=item?.code||'';$('#itemBrand').value=item?.brand||'';$('#itemQty').value=item?.quantity??1;$('#itemUnit').value=item?.unit||'copë';$('#itemHex').value=item?.hex||'#a855f7';$('#itemHexText').value=item?.hex||'#a855f7';$('#itemNotes').value=item?.notes||'';$('#itemImage').value='';currentImageUrl=item?.imageUrl||'';$('#formError').textContent='';$('#colorDialog').showModal();setTimeout(()=>$('#itemName').focus(),50)
    }
    function closeDialog(){if($('#colorDialog').open)$('#colorDialog').close()}
    async function uploadImage(file){
      if(!file)return currentImageUrl;
      if(!user||!remoteEnabled){
        if(file.size>900000) throw new Error('Pa Supabase, fotoja duhet të jetë më e vogël se 900 KB.');
        return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
      }
      const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase();
      const path=`${user.id}/${Date.now()}-${uid()}.${ext}`;
      const {error}=await sb.storage.from('inventory-images').upload(path,file,{upsert:false,contentType:file.type||undefined});
      if(error) throw error;
      return sb.storage.from('inventory-images').getPublicUrl(path).data.publicUrl;
    }

    $('#searchInput').addEventListener('input',render);
    $('#addBtn').onclick=()=>openDialog();
    $('#closeDialog').onclick=closeDialog;$('#cancelDialog').onclick=closeDialog;
    $('#itemHex').addEventListener('input',e=>$('#itemHexText').value=e.target.value);
    $('#itemHexText').addEventListener('input',e=>{if(/^#[0-9a-f]{6}$/i.test(e.target.value))$('#itemHex').value=e.target.value});
    $('#colorGrid').addEventListener('click',async e=>{
      const edit=e.target.closest('[data-edit]'), del=e.target.closest('[data-delete]');
      if(edit){openDialog(items.find(x=>String(x.id)===edit.dataset.edit));return}
      if(del){const item=items.find(x=>String(x.id)===del.dataset.delete);if(!item||!confirm(`Ta fshijmë “${item.name}”?`))return;items=items.filter(x=>String(x.id)!==del.dataset.delete);try{await saveRemote();render();toast('U fshi',item.name)}catch(err){toast('Gabim',err.message)}}
    });
    $('#colorForm').addEventListener('submit',async e=>{
      e.preventDefault();const save=$('#saveBtn');save.disabled=true;$('#formError').textContent='Duke ruajtur…';
      try{
        const id=$('#itemId').value||uid();const old=items.find(x=>String(x.id)===String(id));const imageUrl=await uploadImage($('#itemImage').files?.[0]);
        const item={id,name:$('#itemName').value.trim(),code:$('#itemCode').value.trim(),brand:$('#itemBrand').value.trim(),quantity:Math.max(0,Number($('#itemQty').value||0)),unit:$('#itemUnit').value,hex:/^#[0-9a-f]{6}$/i.test($('#itemHexText').value)?$('#itemHexText').value:$('#itemHex').value,notes:$('#itemNotes').value.trim(),imageUrl,createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};
        if(!item.name)throw new Error('Shkruaj emrin e ngjyrës.');
        const idx=items.findIndex(x=>String(x.id)===String(id));if(idx>=0)items[idx]=item;else items.unshift(item);
        await saveRemote();closeDialog();render();toast('U ruajt',item.name)
      }catch(err){console.error(err);$('#formError').textContent=err.message||'Nuk u ruajt.'}finally{save.disabled=false;if($('#formError').textContent==='Duke ruajtur…')$('#formError').textContent=''}
    });
    $('#refreshBtn').onclick=async()=>{setSync('Duke rifreskuar…',remoteEnabled);await init();toast('U rifreskua','Inventari u përditësua.')};
    $('#backBtn').onclick=()=>{try{if(window.parent!==window&&typeof window.parent.setView==='function'){window.parent.setView('dashboard');return}}catch{}if(history.length>1)history.back();else location.href='index.html'};
    $('#colorDialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog()});
    init();
  </script>
</body>
</html>
